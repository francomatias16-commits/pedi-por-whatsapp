name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:migraciones
      - run: npm run typecheck
      - run: npm test
  base-de-datos:
    # Tests de SQL contra un Postgres embebido (pgserver), los mismos que se corren a mano.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pgserver psycopg2-binary
      - name: Correr todos los tests de supabase/tests
        run: |
          set -e
          for t in supabase/tests/*_test.py; do echo "== $t"; python3 "$t"; done
  e2e:
    # Recorrido tienda -> pedido contra un Supabase de PRUEBA. Se omite si no están los secretos.
    runs-on: ubuntu-latest
    env:
      E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.E2E_URL != ''
      - uses: actions/setup-node@v4
        if: env.E2E_URL != ''
        with: { node-version: 22, cache: npm }
      - name: Instalar, compilar y correr Playwright
        if: env.E2E_URL != ''
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SERVICE_ROLE: ${{ secrets.E2E_SERVICE_ROLE }}
          CRON_SECRET: ci
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && env.E2E_URL != ''
        with: { name: playwright-report, path: playwright-report }
