name: Backup Supabase
# Copia diaria de la base (esquema + datos) como artefacto privado de GitHub, 30 días.
# Requiere el secreto SUPABASE_DB_URL (Connection string "Session pooler" del Dashboard, con la contraseña).
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secreto
        env: { DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: test -n "$DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
      - name: Instalar cliente de Postgres 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Volcado
        env: { DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: |
          set -e
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --format=custom --file=backup.dump
          pg_restore --list backup.dump > /dev/null   # valida que el archivo se pueda leer
          ls -lh backup.dump
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
